# Supabase configuration for the local DEVELOPMENT environment
# (design.md §9). Staging and production are separate cloud projects with
# their own env values — this file drives `supabase start` / `db push`
# against the local dev project only.

project_id = "ecommerce-dev"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin"]
jwt_expiry = 3600

[storage]
enabled = true
file_size_limit = "5MB"

[storage.buckets.product-images]
public = true
file_size_limit = "5MB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]